{% extends 'base.html' %}
{% block content %}
<h1 class="mb-3">Haverly Optimization Runs</h1>
<p class="text-muted">Visualize optimization results: objective value, margin, solve time, and product/crude splits.</p>

<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="input-group">
      <span class="input-group-text">Models</span>
      <input id="inp-models" type="text" class="form-control" placeholder="Monthly_LP_Base,Weekly_MILP_Advanced">
    </div>
  </div>
  <div class="col-md-6">
    <div class="input-group">
      <span class="input-group-text">From</span>
      <input id="inp-from" type="datetime-local" class="form-control">
      <span class="input-group-text">To</span>
      <input id="inp-to" type="datetime-local" class="form-control">
    </div>
  </div>
  <div class="col-md-2 d-grid">
    <button id="btn-load" class="btn btn-primary">Load</button>
  </div>
</div>

<div class="row g-4">
  <div class="col-lg-8">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title">Objective & Margin</h5>
        <canvas id="objectiveChart" height="120"></canvas>
      </div>
    </div>
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Product Yields (BPD)</h5>
        <canvas id="productChart" height="140"></canvas>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title">Crude Slate (BPD)</h5>
        <canvas id="crudeChart" height="160"></canvas>
      </div>
    </div>
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Solve Time (s) & Status</h5>
        <div id="runsTable" class="small" style="max-height:220px; overflow:auto"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
let objectiveChart, productChart, crudeChart;
function colors(n){ const p=['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc948','#b07aa1','#ff9da7','#9c755f','#bab0ab']; return Array.from({length:n},(_,i)=>p[i%p.length]); }
async function get(url){ const r=await fetch(url); if(!r.ok) throw new Error(await r.text()); return await r.json(); }
function stacked(ctx, labels, datasets){ return new Chart(ctx,{type:'bar', data:{labels,datasets}, options:{responsive:true, plugins:{legend:{position:'bottom'}}, scales:{x:{stacked:true}, y:{stacked:true}}}}); }
function table(containerId, cols, rows){ const el=document.getElementById(containerId); const head='<div class="fw-semibold border-bottom pb-1 mb-1">'+cols.map(c=>`<span class="me-3">${c}</span>`).join('')+'</div>'; const body=rows.map(r=>'<div class="border-bottom py-1">'+cols.map(c=>`<span class="me-3">${r[c]}</span>`).join('')+'</div>').join(''); el.innerHTML=head+body; }

async function load(){
  const models=document.getElementById('inp-models').value; const from=document.getElementById('inp-from').value; const to=document.getElementById('inp-to').value; const q=new URLSearchParams(); if(models) q.set('models',models); if(from) q.set('from',new Date(from).toISOString()); if(to) q.set('to',new Date(to).toISOString());
  const data=await get('/api/haverly/runs?'+q.toString()); const recs=data.records||[]; const labels=recs.map(r=>r.model_name);
  // Objective & Margin
  const objDs=[{label:'Objective ($/day)', data:recs.map(r=>r.objective_value), backgroundColor:'#4e79a7'},{label:'Margin ($/bbl)', data:recs.map(r=>r.refinery_margin_usd_bbl), backgroundColor:'#59a14f', yAxisID:'y1'}];
  if (objectiveChart) objectiveChart.destroy();
  objectiveChart = new Chart(document.getElementById('objectiveChart'), {type:'bar', data:{labels, datasets: objDs}, options:{ responsive:true, plugins:{legend:{position:'bottom'}}, scales:{y:{title:{display:true,text:'$/day'}}, y1:{position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'$/bbl'}}}}});
  // Product yields
  const prodCols=['product_gasoline_bpd','product_diesel_bpd','product_jet_bpd','product_fuel_oil_bpd']; const prodLabels=['Gasoline','Diesel','Jet','Fuel Oil']; const prodColors=colors(prodCols.length);
  const prodDs=prodCols.map((c,i)=>({label:prodLabels[i], data:recs.map(r=>r[c]), backgroundColor:prodColors[i]}));
  if (productChart) productChart.destroy(); productChart = stacked(document.getElementById('productChart'), labels, prodDs);
  // Crude slate
  const crudeCols=['crude_wti_bpd','crude_brent_bpd','crude_maya_bpd','crude_arab_bpd','crude_urals_bpd']; const crudeNames=['WTI','Brent','Maya','Arab','Urals']; const cc=colors(crudeCols.length);
  const crudeDs=crudeCols.map((c,i)=>({label:crudeNames[i], data:recs.map(r=>r[c]), backgroundColor:cc[i]}));
  if (crudeChart) crudeChart.destroy(); crudeChart = stacked(document.getElementById('crudeChart'), labels, crudeDs);
  // Table
  table('runsTable', ['optimization_id','solver_status','solve_time_seconds','duality_gap','constraint_violations'], recs);
}

document.getElementById('btn-load').addEventListener('click', ()=>load().catch(e=>alert(e)));
load();
</script>
{% endblock %}
