<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or 'Crude Assay Platform' }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f6f8fb; }
    .navbar-brand { font-weight: 600; }
    .container-narrow { max-width: 1100px; }
    footer { color:#6c757d; font-size:.9rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Crude Assay</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample" aria-controls="navbarsExample" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarsExample">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link {% if active=='home' %}active{% endif %}" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='predict' %}active{% endif %}" href="/predict">Predict</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='market' %}active{% endif %}" href="/market">Market</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='pi' %}active{% endif %}" href="/pi">PI Data</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='bliss' %}active{% endif %}" href="/bliss">Bliss</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='haverly' %}active{% endif %}" href="/haverly">Haverly</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='optimization' %}active{% endif %}" href="/optimization">Optimization</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='intertek' %}active{% endif %}" href="/intertek">Intertek</a></li>
          <li class="nav-item"><a class="nav-link {% if active=='about' %}active{% endif %}" href="/about">About</a></li>
        </ul>
        <span class="navbar-text text-light small">API: <code>/api/*</code></span>
      </div>
    </div>
  </nav>

  <main class="container container-narrow py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="container container-narrow py-4 border-top">
    <div class="d-flex justify-content-between">
      <div>© {{ 2025 }} Crude Assay Demo</div>
      <div><a href="/about" class="text-decoration-none">About</a></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
