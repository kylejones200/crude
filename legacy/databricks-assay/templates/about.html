{% extends 'base.html' %}
{% block content %}
<h1 class="mb-3">About & Diagnostics</h1>
<p class="text-muted">Server health, model details, and environment info.</p>

<div class="row g-4">
  <div class="col-md-6">
    <div class="card shadow-sm h-100">
      <div class="card-body">
        <h5 class="card-title">Health</h5>
        <pre id="health" class="mb-0" style="white-space: pre-wrap"></pre>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card shadow-sm h-100">
      <div class="card-body">
        <h5 class="card-title">Model Info</h5>
        <pre id="model" class="mb-0" style="white-space: pre-wrap"></pre>
      </div>
    </div>
  </div>
</div>

<script>
async function loadHealth() {
  const r = await fetch('/api/health');
  const j = await r.json();
  document.getElementById('health').textContent = JSON.stringify(j, null, 2);
}
async function loadModel() {
  const r = await fetch('/api/model_info');
  const j = await r.json();
  document.getElementById('model').textContent = JSON.stringify(j, null, 2);
}
loadHealth();
loadModel();
</script>
{% endblock %}
