[project]
name = "assay"
version = "0.1.0"
description = "Crude assay analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
 "Flask==3.0.3",
 "Flask-SocketIO==5.3.6",
 "marshmallow>=3.20.0",
 "PyYAML==6.0.2",
 "numpy==1.26.4",
 "pandas==2.2.2",
 "scipy==1.13.0",
 "scikit-learn==1.4.2",
 "statsmodels==0.14.1",
 "joblib==1.4.0",
 "arch==7.0.0",
 "yfinance==0.2.28",
 "pandas-datareader>=0.10.0",
 "python-dotenv>=1.0.0",
 "pyspark>=3.5.0",
 "mlflow>=2.8.0",
 "protobuf>=3.20.0",
 "requests==2.31.0",
 "schedule==1.2.2",
 "timesfm",
 "eventlet==0.35.2",
 "redis==5.0.1",
 "websocket-client==1.7.0",
 "Flask-CORS==4.0.0",
 "Flask-Limiter==3.5.0",
 "openpyxl==3.1.5",
 "XlsxWriter==3.2.0",
 "requests-cache>=1.2.0",
 "python-pptx>=0.6.21",
 "reportlab>=4.2.0",
 "pytest==7.4.3",
 "pytest-cov==4.1.0",
 "pytest-flask==1.3.0",
 "pytest-mock==3.12.0",
 "pytest-asyncio==0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: two installable packages; app orchestrates, domain decides
sources = ["src"]
packages = ["src/domain_pkg", "src/app_pkg", "core", "routes", "services"]

[dependency-groups]
dev = []

# Optional: for services/assay blend_solver (LP/MIP)
# uv sync --group assay-opt
assay-opt = ["pulp", "cvxpy"]

# Install: uv sync
# Add dep: uv add <package>
# Run: uv run python app.py
